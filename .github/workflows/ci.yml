name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Catalog is up to date
        run: python scripts/build_catalog.py --check

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check-bundle

  ci-gate:
    name: ci-gate
    # The main ruleset requires this one check. It passes only when every job
    # in this file succeeded, so new jobs must be added to needs (checked below).
    if: ${{ always() }}
    needs:
      - test
      - desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ci-gate needs every job in this file
        run: python3 .github/scripts/check_ci_gate.py .github/workflows/ci.yml
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: data["result"] for job, data in json.loads(os.environ["NEEDS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          failed = sorted(job for job, result in results.items() if result != "success")
          if failed or not results:
              print("ci-gate FAILED: " + (", ".join(failed) or "no jobs"))
              sys.exit(1)
          PY
